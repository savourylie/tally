<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"/>
  <title>Tally · macOS prototype</title>
  <link rel="stylesheet" href="ui_kit.css"/>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="shared.jsx"></script>
  <script type="text/babel" src="MenuBar.jsx"></script>
  <script type="text/babel" src="Popover.jsx"></script>
  <script type="text/babel" src="OverviewScreen.jsx"></script>
  <script type="text/babel" src="SettingsScreen.jsx"></script>
  <script type="text/babel" src="MainWindow.jsx"></script>
  <script type="text/babel" src="Onboarding.jsx"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [popover, setPopover]   = useState(false);
      const [mainOpen, setMainOpen] = useState(false);
      const [mainTab, setMainTab]   = useState('overview');
      const [onb, setOnb]           = useState(false);

      // First run hint — show onboarding once
      useEffect(() => {
        if (!localStorage.getItem('tally:onboarded')) {
          const t = setTimeout(() => setOnb(true), 350);
          return () => clearTimeout(t);
        }
      }, []);

      const dismissOnb = () => {
        localStorage.setItem('tally:onboarded', '1');
        setOnb(false);
      };

      const openMain = (tab = 'overview') => {
        setMainTab(tab);
        setMainOpen(true);
        setPopover(false);
      };

      // Close popover on outside click
      useEffect(() => {
        if (!popover) return;
        const handler = (e) => {
          if (!e.target.closest('.popover') && !e.target.closest('.tally-icon')) setPopover(false);
        };
        document.addEventListener('mousedown', handler);
        return () => document.removeEventListener('mousedown', handler);
      }, [popover]);

      const usageLabel = `${TOTAL_GB.toFixed(1)} GB`;

      return (
        <div className="desktop">
          <MenuBar
            usageLabel={usageLabel}
            popoverOpen={popover}
            onTallyClick={() => setPopover(p => !p)}
          />
          <div className="desktop-body">
            {!popover && !mainOpen && !onb && (
              <div className="desktop-hint">
                點右上角的 <kbd>||||̸ 12.4 GB</kbd> 打開 Tally
              </div>
            )}
          </div>

          {popover && (
            <Popover
              onOpenMain={() => openMain('overview')}
              onClose={() => setPopover(false)}
            />
          )}

          {mainOpen && (
            <MainWindow
              initialTab={mainTab}
              onClose={() => setMainOpen(false)}
              onReplayOnboarding={() => { setMainOpen(false); setOnb(true); }}
            />
          )}

          {onb && <Onboarding onClose={dismissOnb} />}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
