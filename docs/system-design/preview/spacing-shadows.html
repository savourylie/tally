<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><title>Spacing — Elevation</title>
<link rel="stylesheet" href="_card.css">
<style>
  body { padding: 28px; background: var(--bg-app); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; align-items: center; }
  .surface {
    background: var(--bg-card); border-radius: var(--r-10);
    border: 1px solid var(--border); padding: 22px 18px;
    font-size: 12px; color: var(--fg-2);
  }
  .surface.popover { box-shadow: var(--shadow-popover); }
  .surface.modal { box-shadow: var(--shadow-modal); }
  .surface code { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); display: block; margin-top: 6px; }
</style>
</head><body>
  <div class="row">
    <div class="surface popover">
      Popover elevation
      <code>--shadow-popover</code>
    </div>
    <div class="surface modal">
      Modal elevation (onboarding)
      <code>--shadow-modal</code>
    </div>
  </div>
  <p style="color: var(--fg-3); font-size: 12px; margin-top: 18px;">
    Used <em>only</em> for floating surfaces. Cards, buttons, sidebar items are flat — bordered, not lifted.
  </p>
</body></html>
