<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><title>Components — Sidebar item</title>
<link rel="stylesheet" href="_card.css">
<style>
  body { padding: 20px; background: var(--bg-app); }
  .demo { display: grid; grid-template-columns: 220px 1fr; gap: 28px; }
  .sidebar {
    background: var(--bg-sidebar); border: 1px solid var(--border); border-radius: var(--r-8);
    padding: 14px 10px; display: flex; flex-direction: column; gap: 2px;
  }
  .item {
    display: flex; align-items: center; gap: 10px;
    padding: 5px 8px; border-radius: 6px;
    color: var(--fg-2); font-size: 13px; cursor: pointer;
  }
  .item:hover { background: var(--bg-hover); color: var(--fg-1); }
  .item.active { background: var(--bg-selected); color: var(--brand-700); font-weight: 500; }
  .item .ic { width: 16px; height: 16px; flex-shrink: 0; }
  .group-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--fg-3); padding: 12px 8px 4px; }

  .notes { display: flex; flex-direction: column; gap: 10px; color: var(--fg-2); font-size: 12px; line-height: 1.55; }
  .notes code { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); background: var(--bg-card); padding: 1px 4px; border-radius: 3px; border: 1px solid var(--border); }
</style>
</head><body>
  <div class="demo">
    <div class="sidebar">
      <div class="item active">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        總覽
      </div>
      <div class="item">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18"/></svg>
        Apps
      </div>
      <div class="item">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
        歷史
      </div>
      <div class="item">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 12.5a9 9 0 0 1 14 0"/><path d="M8.5 16a4 4 0 0 1 7 0"/><circle cx="12" cy="19" r="1.2"/></svg>
        網路
      </div>
      <div style="height: 8px;"></div>
      <div class="item">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h.1a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v.1a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        設定
      </div>
    </div>
    <div class="notes">
      <p><strong>Anatomy.</strong> 16-px Lucide icon · 10-px gap · 13-px label. Padding <code>5px 8px</code>, radius <code>6px</code>.</p>
      <p><strong>States.</strong> hover → <code>bg-hover</code> · selected → <code>bg-selected</code> + amber-tinted label. No left-border accent.</p>
      <p><strong>Width.</strong> Sidebar is exactly 200 px in the main window.</p>
    </div>
  </div>
</body></html>
