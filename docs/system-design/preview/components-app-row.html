<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><title>Components — App row card</title>
<link rel="stylesheet" href="_card.css">
<style>
  body { padding: 18px; }
  .stack { display: flex; flex-direction: column; gap: 8px; }
  .row {
    display: grid; grid-template-columns: 32px 1fr auto;
    gap: 12px; align-items: center;
    padding: 12px 14px;
    border: 1px solid var(--border); border-radius: var(--r-8);
    background: var(--bg-card);
  }
  .row:hover { background: var(--bg-hover); }
  .icon {
    width: 32px; height: 32px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 600; font-size: 14px;
  }
  .name { font-size: 13px; font-weight: 500; color: var(--fg-1); }
  .sub  { font-size: 11px; color: var(--fg-3); margin-top: 1px; }
  .num  { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 13px; }
  .pct  { color: var(--fg-3); font-size: 11px; margin-top: 1px; }

  .icon.chrome { background: linear-gradient(135deg, #DB4437, #F4B400 60%, #0F9D58 100%); }
  .icon.icloud { background: #2D86F0; }
  .icon.slack  { background: #4A154B; }
  .icon.update { background: var(--n-700); }
  .icon.spotlight { background: var(--n-500); }
</style>
</head><body>
  <div class="stack">
    <div class="row">
      <div class="icon chrome">C</div>
      <div><div class="name">Chrome</div><div class="sub">瀏覽器 · 主要流量來源</div></div>
      <div class="num">4.23 GB<div class="pct">佔 34%</div></div>
    </div>
    <div class="row">
      <div class="icon icloud">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M17.5 18.5a4 4 0 0 0 .5-7.95A6 6 0 0 0 6.7 11 4.5 4.5 0 0 0 7.5 19.95h10z"/></svg>
      </div>
      <div><div class="name">iCloud</div><div class="sub">含 同步、照片、備份</div></div>
      <div class="num">2.10 GB<div class="pct">佔 17%</div></div>
    </div>
    <div class="row">
      <div class="icon slack">#</div>
      <div><div class="name">Slack</div><div class="sub">訊息、檔案</div></div>
      <div class="num">1.09 GB<div class="pct">佔 9%</div></div>
    </div>
    <div class="row">
      <div class="icon update">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M12 4v12m0 0l-5-5m5 5l5-5M5 20h14"/></svg>
      </div>
      <div><div class="name">軟體更新</div><div class="sub">系統 · 不能關，但可以了解</div></div>
      <div class="num">0.65 GB<div class="pct">佔 5%</div></div>
    </div>
  </div>
</body></html>
