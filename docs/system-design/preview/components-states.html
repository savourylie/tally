<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><title>Components — Hover/press states</title>
<link rel="stylesheet" href="_card.css">
<style>
  body { padding: 22px; }
  .group { display: grid; grid-template-columns: 80px repeat(4, 1fr); gap: 10px; align-items: center; margin-bottom: 14px; }
  .group:last-child { margin-bottom: 0; }
  .lbl { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); }
  .col-label { font-size: 11px; color: var(--fg-3); text-align: center; }

  /* Sample row */
  .row {
    padding: 10px 12px; border-radius: 6px;
    background: var(--bg-card); border: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; color: var(--fg-1);
  }
  .row .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  .row.hover { background: rgba(0,0,0,0.04); }
  .row.press { background: rgba(0,0,0,0.07); }
  .row.focus { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Sample btn */
  .b { padding: 6px 12px; border-radius: 6px; background: var(--accent); color: #fff; font-size: 12px; border: 0; }
  .b.hover { background: var(--accent-hover); }
  .b.press { background: var(--accent-press); }
  .b.focus { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head><body>
  <div class="group">
    <span class="lbl">row</span>
    <div class="col-label">default</div>
    <div class="col-label">hover</div>
    <div class="col-label">press</div>
    <div class="col-label">focus</div>
  </div>
  <div class="group">
    <span></span>
    <div class="row"><span class="dot"></span>Chrome</div>
    <div class="row hover"><span class="dot"></span>Chrome</div>
    <div class="row press"><span class="dot"></span>Chrome</div>
    <div class="row focus"><span class="dot"></span>Chrome</div>
  </div>
  <div class="group">
    <span class="lbl">button</span>
    <div style="text-align:center"><button class="b">儲存</button></div>
    <div style="text-align:center"><button class="b hover">儲存</button></div>
    <div style="text-align:center"><button class="b press">儲存</button></div>
    <div style="text-align:center"><button class="b focus">儲存</button></div>
  </div>
</body></html>
