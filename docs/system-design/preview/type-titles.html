<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><title>Type — Title scale</title>
<link rel="stylesheet" href="_card.css">
<style>
  body { padding: 24px; }
  .row {
    display: grid; grid-template-columns: 1fr auto;
    padding: 10px 0; border-bottom: 1px dashed var(--divider);
    align-items: baseline;
  }
  .row:last-child { border-bottom: 0; }
  .row .meta { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); }
</style>
</head><body>
  <div class="row"><span class="t-title-1">設定</span><span class="meta">t-title-1 · 22 / 600</span></div>
  <div class="row"><span class="t-title-2">每月可以用多少</span><span class="meta">t-title-2 · 17 / 600</span></div>
  <div class="row"><span class="t-title-3">提醒時機</span><span class="meta">t-title-3 · 15 / 600</span></div>
  <div class="row"><span class="t-micro-caps">傳出 · 收進</span><span class="meta">t-micro-caps · 10 / 600 / uppercase</span></div>
</body></html>
