<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><title>Brand — Mark + Menu bar</title>
<link rel="stylesheet" href="_card.css">
<style>
  body { padding: 28px; }
  .stage { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
  .panel {
    border: 1px solid var(--border); border-radius: var(--r-10);
    padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 10px;
    min-height: 140px; justify-content: center;
  }
  .panel small { color: var(--fg-3); font-size: 11px; }

  /* Faux menu bar */
  .menubar {
    width: 100%;
    background: linear-gradient(180deg, rgba(255,255,255,0.7), rgba(255,255,255,0.55));
    backdrop-filter: blur(20px);
    border: 1px solid var(--border); border-radius: 6px;
    display: flex; align-items: center; justify-content: flex-end;
    gap: 14px; padding: 4px 10px; height: 28px;
    color: var(--fg-1);
  }
  .menubar .item { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; }
  .menubar svg { color: var(--fg-1); }
  .menubar .num { font-family: var(--font-mono); font-size: 11px; color: var(--fg-2); }
</style>
</head><body>
  <div class="stage">
    <div class="panel">
      <img src="../assets/logo-mark.svg" width="72" height="72" alt="">
      <small>logo-mark.svg · 80×80</small>
    </div>
    <div class="panel">
      <div style="background: #1B1814; border-radius: 18px; padding: 10px;">
        <svg viewBox="0 0 80 80" width="72" height="72">
          <rect width="80" height="80" rx="18" fill="#26221B"/>
          <g stroke="#E89B2F" stroke-width="6" stroke-linecap="round" fill="none">
            <line x1="20" y1="22" x2="20" y2="58"/>
            <line x1="32" y1="22" x2="32" y2="58"/>
            <line x1="44" y1="22" x2="44" y2="58"/>
            <line x1="56" y1="22" x2="56" y2="58"/>
            <line x1="14" y1="56" x2="62" y2="24"/>
          </g>
        </svg>
      </div>
      <small>on dark surface</small>
    </div>
    <div class="panel">
      <div class="menubar">
        <span class="item" title="Tally" style="color: var(--fg-1);">
          <svg width="14" height="14" viewBox="0 0 22 22"><g stroke="currentColor" stroke-width="1.7" stroke-linecap="round" fill="none"><line x1="5" y1="6" x2="5" y2="16"/><line x1="9" y1="6" x2="9" y2="16"/><line x1="13" y1="6" x2="13" y2="16"/><line x1="17" y1="6" x2="17" y2="16"/><line x1="3.5" y1="15" x2="18.5" y2="7"/></g></svg>
        </span>
        <span class="num">12.4 GB</span>
        <span class="item"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2v3M12 19v3M4.93 4.93l2.12 2.12M16.95 16.95l2.12 2.12M2 12h3M19 12h3M4.93 19.07l2.12-2.12M16.95 7.05l2.12-2.12"/></svg></span>
        <span class="item" style="font-family: var(--font-mono); font-size: 11px;">14:32</span>
      </div>
      <small>menu bar with usage shown</small>
    </div>
  </div>
</body></html>
