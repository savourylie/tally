<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><title>Colors — Warm neutrals</title>
<link rel="stylesheet" href="_card.css">
<style>
  .ramp { display: grid; grid-template-columns: repeat(12, 1fr); gap: 4px; }
  .swatch { height: 64px; border-radius: 6px; }
  .swatch .meta { position: absolute; left: 6px; top: 4px; font-family: var(--font-mono); font-size: 9px; }
  .swatch .val { position: absolute; left: 6px; bottom: 4px; font-family: var(--font-mono); font-size: 9px; opacity: 0.8; }
  .note { margin-top: 12px; color: var(--fg-2); font-size: 12px; }
</style>
</head><body>
  <div class="ramp">
    <div class="swatch" style="background:#FFFFFF"><span class="meta" style="color:#1F1C16">0</span><span class="val" style="color:#1F1C16">#FFFFFF</span></div>
    <div class="swatch" style="background:#FCFBF8"><span class="meta" style="color:#1F1C16">25</span><span class="val" style="color:#1F1C16">#FCFBF8</span></div>
    <div class="swatch" style="background:#FAF9F7"><span class="meta" style="color:#1F1C16">50</span><span class="val" style="color:#1F1C16">#FAF9F7</span></div>
    <div class="swatch" style="background:#F4F2EC"><span class="meta" style="color:#1F1C16">100</span><span class="val" style="color:#1F1C16">#F4F2EC</span></div>
    <div class="swatch" style="background:#EDEAE3"><span class="meta" style="color:#1F1C16">150</span><span class="val" style="color:#1F1C16">#EDEAE3</span></div>
    <div class="swatch" style="background:#E8E5DE"><span class="meta" style="color:#1F1C16">200</span><span class="val" style="color:#1F1C16">#E8E5DE</span></div>
    <div class="swatch" style="background:#D8D3C8"><span class="meta" style="color:#1F1C16">300</span><span class="val" style="color:#1F1C16">#D8D3C8</span></div>
    <div class="swatch" style="background:#BAB3A4"><span class="meta" style="color:#1F1C16">400</span><span class="val" style="color:#1F1C16">#BAB3A4</span></div>
    <div class="swatch" style="background:#8E8779"><span class="meta" style="color:#fff">500</span><span class="val" style="color:#fff">#8E8779</span></div>
    <div class="swatch" style="background:#4A453A"><span class="meta" style="color:#fff">700</span><span class="val" style="color:#fff">#4A453A</span></div>
    <div class="swatch" style="background:#2E2A22"><span class="meta" style="color:#fff">800</span><span class="val" style="color:#fff">#2E2A22</span></div>
    <div class="swatch" style="background:#15130F"><span class="meta" style="color:#fff">950</span><span class="val" style="color:#fff">#15130F</span></div>
  </div>
  <p class="note">Warm, slightly cream — not cool grey. Hex values lean ~5° toward yellow, giving Tally a hand-rendered, paper-tally-on-wall feel without ever reading as "beige".</p>
</body></html>
