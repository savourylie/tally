<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><title>Spacing scale</title>
<link rel="stylesheet" href="_card.css">
<style>
  body { padding: 24px; }
  .row { display: grid; grid-template-columns: 72px 1fr 90px; align-items: center; gap: 14px; padding: 4px 0; }
  .bar { background: var(--accent); height: 16px; border-radius: 3px; }
  .name { font-family: var(--font-mono); font-size: 11px; color: var(--fg-2); }
  .val { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); text-align: right; }
</style>
</head><body>
  <div class="row"><span class="name">--s-1</span><div class="bar" style="width: 4px;"></div><span class="val">4 px</span></div>
  <div class="row"><span class="name">--s-2</span><div class="bar" style="width: 8px;"></div><span class="val">8 px</span></div>
  <div class="row"><span class="name">--s-3</span><div class="bar" style="width: 12px;"></div><span class="val">12 px</span></div>
  <div class="row"><span class="name">--s-4</span><div class="bar" style="width: 16px;"></div><span class="val">16 px</span></div>
  <div class="row"><span class="name">--s-5</span><div class="bar" style="width: 20px;"></div><span class="val">20 px</span></div>
  <div class="row"><span class="name">--s-6</span><div class="bar" style="width: 24px;"></div><span class="val">24 px</span></div>
  <div class="row"><span class="name">--s-8</span><div class="bar" style="width: 32px;"></div><span class="val">32 px</span></div>
  <div class="row"><span class="name">--s-10</span><div class="bar" style="width: 40px;"></div><span class="val">40 px</span></div>
  <div class="row"><span class="name">--s-12</span><div class="bar" style="width: 48px;"></div><span class="val">48 px</span></div>
  <div class="row"><span class="name">--s-16</span><div class="bar" style="width: 64px;"></div><span class="val">64 px</span></div>
</body></html>
