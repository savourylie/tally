<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><title>Components — Notification</title>
<link rel="stylesheet" href="_card.css">
<style>
  body { padding: 24px; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .notif {
    display: grid; grid-template-columns: 36px 1fr auto;
    gap: 12px; align-items: flex-start;
    padding: 12px 14px;
    background: var(--bg-popover);
    backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: var(--r-10);
    box-shadow: var(--shadow-popover);
  }
  .notif .icon {
    width: 36px; height: 36px; border-radius: 8px;
    background: var(--accent-soft); display: flex; align-items: center; justify-content: center;
    color: var(--accent);
  }
  .notif .title { font-size: 13px; font-weight: 600; color: var(--fg-1); margin-bottom: 2px; }
  .notif .body  { font-size: 12px; color: var(--fg-2); }
  .notif .app   { font-size: 10px; color: var(--fg-3); text-transform: uppercase; letter-spacing: 0.06em; }
</style>
</head><body>
  <div class="stack">
    <div class="notif">
      <div class="icon" style="background:#FDF1D6; color:#8A530A;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.3 3.7l-7.7 13a2 2 0 0 0 1.7 3h15.4a2 2 0 0 0 1.7-3l-7.7-13a2 2 0 0 0-3.4 0z"/><path d="M12 9v4"/><circle cx="12" cy="17" r="1"/></svg>
      </div>
      <div>
        <div class="app">Tally · 現在</div>
        <div class="title">這個月的流量已經用了 80% 了</div>
        <div class="body">還剩 4 GB。月底還有 8 天。</div>
      </div>
      <div></div>
    </div>
    <div class="notif">
      <div class="icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12.5a9 9 0 0 1 14 0"/><path d="M6.5 16a4 4 0 0 1 7 0"/><circle cx="10" cy="19" r="1.2" fill="currentColor"/><path d="M19 5l3 3-3 3" stroke-linecap="round"/></svg>
      </div>
      <div>
        <div class="app">Tally · 1 分前</div>
        <div class="title">你現在用的是 iPhone 的熱點</div>
        <div class="body">這裡的流量會算進電信費。要暫停 iCloud 同步嗎？</div>
      </div>
      <div></div>
    </div>
  </div>
</body></html>
