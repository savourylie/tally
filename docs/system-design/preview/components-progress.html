<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><title>Components — Progress</title>
<link rel="stylesheet" href="_card.css">
<style>
  body { padding: 22px; }
  .item { margin-bottom: 18px; }
  .item:last-child { margin-bottom: 0; }
  .top { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 6px; font-size: 12px; color: var(--fg-2); }
  .top .pct { font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--fg-1); font-weight: 500; }
  .track {
    height: 10px; background: var(--n-150);
    border-radius: 999px; overflow: hidden;
    border: 1px solid var(--border);
  }
  .fill { height: 100%; border-radius: 999px; transition: width var(--dur-state) var(--ease-standard); }
  .fill.good { background: var(--success); }
  .fill.brand { background: var(--accent); }
  .fill.warn { background: var(--warning); }
  .fill.danger { background: var(--danger); }
  .caption { color: var(--fg-3); font-size: 11px; margin-top: 4px; }
</style>
</head><body>
  <div class="item">
    <div class="top"><span>本月用量 <strong style="color:var(--fg-1);">4.1 GB</strong> / 20 GB</span><span class="pct">21%</span></div>
    <div class="track"><div class="fill good" style="width:21%"></div></div>
    <div class="caption">用量充足，沒什麼好擔心。</div>
  </div>
  <div class="item">
    <div class="top"><span>本月用量 <strong style="color:var(--fg-1);">12.4 GB</strong> / 20 GB</span><span class="pct">62%</span></div>
    <div class="track"><div class="fill brand" style="width:62%"></div></div>
    <div class="caption">以目前速度，月底會用到 18 GB。</div>
  </div>
  <div class="item">
    <div class="top"><span>本月用量 <strong style="color:var(--fg-1);">16.4 GB</strong> / 20 GB</span><span class="pct">82%</span></div>
    <div class="track"><div class="fill warn" style="width:82%"></div></div>
    <div class="caption">已用 80%。月底前如果照這個速度，會超過上限。</div>
  </div>
  <div class="item">
    <div class="top"><span>本月用量 <strong style="color:var(--fg-1);">21.2 GB</strong> / 20 GB</span><span class="pct" style="color:var(--danger);">超過 6%</span></div>
    <div class="track"><div class="fill danger" style="width:100%"></div></div>
    <div class="caption" style="color: var(--danger);">超過上限 1.2 GB</div>
  </div>
</body></html>
