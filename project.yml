name: Tally
options:
  bundleIdPrefix: com.calvinku
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
    GENERATE_INFOPLIST_FILE: NO
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 7.0.0
targets:
  Tally:
    type: application
    platform: macOS
    sources:
      - Tally/Sources
      - Tally/Resources
    dependencies:
      - package: GRDB
      - target: TallyFilterExtension
        embed: true
    info:
      path: Tally/Info.plist
      properties:
        CFBundleDisplayName: Tally
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: Copyright © 2026 Calvin Ku. All rights reserved.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.calvinku.tally
        PRODUCT_NAME: Tally
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        COMBINE_HIDPI_IMAGES: YES
        CODE_SIGN_ENTITLEMENTS: Tally/Tally.entitlements
  TallyFilterExtension:
    type: system-extension
    platform: macOS
    sources:
      - TallyFilterExtension
      - Tally/Sources/Shared
    info:
      path: TallyFilterExtension/Info.plist
      properties:
        CFBundleDisplayName: Tally Filter Extension
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NetworkExtension:
          NEProviderClasses:
            com.apple.networkextension.filter-data: $(PRODUCT_MODULE_NAME).TallyFilterDataProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.calvinku.tally.filter
        PRODUCT_NAME: TallyFilterExtension
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_ENTITLEMENTS: TallyFilterExtension/TallyFilterExtension.entitlements
  TallyTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - TallyTests
    dependencies:
      - target: Tally
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.calvinku.tally.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Tally:
    build:
      targets:
        Tally: all
        TallyFilterExtension: all
        TallyTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TallyTests
    archive:
      config: Release
